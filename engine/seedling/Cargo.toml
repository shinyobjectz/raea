[package]
name = "raea-seedling"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "bevy_seedling on raea's one mixer core: seedling's graph (sample players, pools, effects, raea's Tone effects and limiter registered as nodes) stepped a frame at a time beside the game, its sound a voice of the core, so a render and a play of a game sound the same, sample for sample (sdk/react/docs/audio-stack.md)"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "bevy_asset"] }
# Bevy's audio on Firewheel 0.12 (MIT OR Apache-2.0). Default features off: no cpal 0.18 backend (it can't link beside
# the cpal 0.15 react and void use) and no symphonia (raea decodes): raea's platform runs its processor
bevy_seedling = { version = "=0.8.0", default-features = false }
firewheel = { version = "=0.12.0", default-features = false, features = ["std", "scheduled_events"] }
audioadapter-buffers = { version = "4.0.0", default-features = false, features = ["std"] }
raea-mixer = { path = "../mixer" }
raea-media = { path = "../media", default-features = false, features = ["soft"] }
serde_json = "1"
