[package]
name = "raea-app-videoform"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "`raea videoform` (docs/videoform.feature VF1, VF2): a fingerprint with a videoform section, its references read once, from the drive or a link, keeping only their readings; the rights confirmation, once per account; what the references hold and the person's corrections (VF4, VF4b); the vocabulary the person's AI writes from the context, against the references (VF5)"

[dependencies]
dunce = "1"
raea-io-home = { path = "../../io/home" }
# a link to its videos and their streams (VF1b)
raea-io-resolve = { path = "../../io/resolve" }
# Fingerprint's columns, cached by content hash
raea-sys-columns = { path = "../../systems/columns" }
# the videoform section's types (core/brief videoform.rs), in a fingerprint's folder (systems/fingerprint), found as
# any fingerprint is (systems/fingerprint-use which.rs)
raea-core-brief = { path = "../../core/brief" }
# the kept rows (VF3)
raea-sys-videoform = { path = "../../systems/videoform" }
# the rules mined from them (VF8)
raea-sys-videoform-rules = { path = "../../systems/videoform-rules" }
raea-sys-videoform-follow = { path = "../../systems/videoform-follow" }
# what was asked and how it was made: the documents and the person's words (VF8f)
raea-app-videoform-docs = { path = "../videoform-docs" }
# a brand's kit (VF9b)
raea-sys-videoform-kit = { path = "../../systems/videoform-kit" }
# raea-perceive, beside raea
raea-io-assets = { path = "../../io/assets" }
raea-sys-fingerprint = { path = "../../systems/fingerprint" }
raea-sys-fingerprint-use = { path = "../../systems/fingerprint-use" }
serde_json = "1"
# vocabulary.ts's patterns
regex = "1"
sha2 = "0.10"
# remove, refresh and split, and the report's line on encoders (VF8b, VF8c)
raea-app-videoform-refs = { path = "../videoform-refs" }
