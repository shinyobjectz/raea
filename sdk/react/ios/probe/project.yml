name: MotionProbe
options:
  bundleIdPrefix: com.shinyobjectz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: BJJZ79J5NL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ENABLE_BITCODE: NO
targets:
  MotionProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinyobjectz.motionprobe
        SWIFT_OBJC_BRIDGING_HEADER: Sources/motion.h
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -lraea_motion_ios -lc++ -lz -liconv -framework Metal -framework QuartzCore -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox -framework CoreText -framework CoreGraphics -framework Security -framework IOSurface -framework AudioToolbox -framework CoreImage -framework ImageIO -framework AVFAudio -framework MediaToolbox -framework CoreAudio -framework SystemConfiguration -framework UIKit -framework JavaScriptCore
        INFOPLIST_KEY_CFBundleDisplayName: Motion Probe
