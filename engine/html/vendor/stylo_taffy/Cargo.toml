# Vendored from https://github.com/DioxusLabs/blitz (rev a53fbab, packages/stylo_taffy; rebased onto the 0.3.0-beta.3 release,
# the one dioxus-native 0.8 pins, by a 3-way merge from a53fbab), MIT OR Apache-2.0 OR MPL-2.0,
# with the workspace-inherited fields written out. Local change ("raea"): container-type no longer makes an
# element the containing block of positioned descendants (src/convert.rs), as in Chrome.
[package]
name = "stylo_taffy"
license = "MIT OR Apache-2.0 OR MPL-2.0"
description = "Interop crate for the stylo and taffy crates"
keywords = ["css", "layout"]
version = "0.3.0-beta.3"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[dependencies]
bitflags = "2.8.0"
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "bc525c030e67d2fd58ecb7b96742f4fb34866c44", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
style = { version = "0.22.0", package = "stylo" }
style_atoms = { version = "0.22.0", package = "stylo_atoms" }

[features]
default = ["std", "block", "flexbox", "grid"]
std = ["taffy/std"]
block = ["taffy/block_layout"]
flexbox = ["taffy/flexbox", "taffy/flexbox_balance"]
grid = ["taffy/grid"]
floats = ["taffy/float_layout"]
# Frame-aware style getters for CSS vertical writing modes (transposes physical styles into Taffy's
# inline/block axes). Off by default: every getter is the plain physical mapping.
writing-mode = []
