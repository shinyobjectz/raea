[package]
name = "raea-brief"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The .brief format (format.md): parsed into the intent graph, formatted, converted from score scripts, compiled; and Track F1, a brief split into beats"

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
regex = "1"
bladeink = "2.1.0"
bladeink-compiler = "2.1.0"

[lib]
name = "raea_brief"
path = "src/format.rs"

[[bin]]
name = "raea-beats"
path = "src/main.rs"

[[bin]]
name = "raea-brief"
path = "src/bin/raea-brief.rs"
