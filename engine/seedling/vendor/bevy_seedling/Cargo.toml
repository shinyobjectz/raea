# raea: the wasm32 Firewheel (features ["wasm-bindgen"]) removed: Firewheel's wasm-bindgen feature brings its cpal
# 0.18 backend, which links alsa-sys as the cpal 0.15 react and void use does, and cargo resolves every target's
# dependencies. raea never builds seedling for the web.

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.getrandom]
version = "0.4"
