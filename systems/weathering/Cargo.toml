[package]
name = "raea-sys-weathering"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Cause maps baked from a glTF's geometry (rain, run-off, shelter, sun, damp, touch) for raea/wear"

[dependencies]
# triangle BVH and ray casts (Apache-2.0); in the tree already through rapier3d
parry3d = "0.31"
rayon = "1"
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
raea-sys-runoff = { path = "../runoff" }
raea-sys-touch = { path = "../touch" }
raea-sys-exposure = { path = "../exposure" }
raea-sys-damage = { path = "../damage" }
raea-sys-glb = { path = "../glb" }
# the atlas the cause maps lie over (and the light bake's, docs/bake.feature BK1)
raea-sys-atlas = { path = "../atlas" }
