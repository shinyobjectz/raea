# raea built natively for Windows on ARM (#82: a Snapdragon X runs the x64 build under emulation, and asked for its
# own). GitHub's windows-11-arm runner builds what release.yml's windows job builds, for aarch64-pc-windows-msvc, runs
# `raea --version`, packs and checks raea-VERSION-windows-arm64.zip with tools/release.sh (RAEA_WIN_ARCH=arm64)
# without drawing (RAEA_CHECK_NO_GPU=1: WARP segfaults in Bevy's compute shaders here as on x64, and Mesa's lavapipe has
# no ARM64 build; a Snapdragon PC is what draws, #82), and on a v* tag attaches it to that
# release. It runs beside release.yml, not in it, so a release never waits on or fails with the ARM64 build; a
# promoted release (release-go.sh) builds it again from the tag. install.ps1 takes it on an ARM64 PC when it's there.
name: windows-arm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit, branch or tag to build"
        required: false
      version:
        description: "the version the zip is named for (raea-VERSION-windows-arm64.zip)"
        required: false
  push:
    branches: [windows-arm64]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 350
    env:
      # the release builds' compile cache (tools/release/compile-cache.sh), under this OS and architecture's own prefix
      RELEASE_CACHE_ENDPOINT: ${{ secrets.RELEASE_CACHE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_CACHE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_CACHE_SECRET }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true
          lfs: false
      - name: Toolchain (rust-toolchain.toml's pin)
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc -vV
      # ring builds its aarch64 assembly with clang (and only clang) on Windows
      - name: clang (ring's assembly)
        run: |
          if ! command -v clang >/dev/null; then
            for d in "/c/Program Files/LLVM/bin" "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Tools/Llvm/ARM64/bin; do
              [ -x "$d/clang.exe" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; break; }
            done
          fi
          command -v clang >/dev/null || { winget install -e --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent; echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"; export PATH="/c/Program Files/LLVM/bin:$PATH"; }
          clang --version
      - name: jq that writes LF
        run: |
          mkdir -p "$RUNNER_TEMP/jq"
          printf '#!/bin/bash\nexec "%s" -b "$@"\n' "$(command -v jq)" > "$RUNNER_TEMP/jq/jq"
          chmod +x "$RUNNER_TEMP/jq/jq"
          echo "$RUNNER_TEMP/jq" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: The runtime's packages
        run: for d in sdk/react/js sdk/react/tw; do (cd "$d" && bun install --frozen-lockfile); done
      # (an sccache the action can't fetch for ARM64 Windows leaves the build uncached, as compile-cache.sh does)
      - name: Compile cache (sccache, as release.yml's)
        if: env.AWS_ACCESS_KEY_ID != ''
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use the compile cache
        if: env.AWS_ACCESS_KEY_ID != ''
        run: bash tools/release/compile-cache.sh
      - name: Build
        run: |
          feat=$(bash tools/bevy-plugins.sh features sdk/raea/bench/bevy-plugins)
          t() { s=$SECONDS; "$@"; echo "::notice::Windows ARM64 $(( (SECONDS - s) / 60 )) min: ${*:7}"; }
          t cargo build --profile dist --locked -p raea-cli --bin raea --no-default-features --features "$feat"
          t cargo build --profile dist --locked -p raea-rune-host
          t cargo build --profile dist --locked -p raea-page-host --features window
          t cargo build --profile dist --locked -p raea-perceive
      - name: What raea.exe is and imports
        run: |
          file target/dist/raea.exe || true
          dumpbin=$(ls "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/bin/Hostarm64/arm64/dumpbin.exe 2>/dev/null | head -1)
          [ -n "$dumpbin" ] && "$dumpbin" -nologo -headers -dependents target/dist/raea.exe | grep -iE 'machine|\.dll$' | sed 's/^ *//' | tee -a "$GITHUB_STEP_SUMMARY" || true
          target/dist/raea.exe --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Models (pinned by URL and sha256 in tools/release/models.tsv)
        run: |
          while IFS=$'\t' read -r path url sha; do
            case $path in ''|'#'*) continue ;; esac
            mkdir -p "$HOME/.local/share/raea-models/$(dirname "$path")"
            curl -fsSL "$url" -o "$HOME/.local/share/raea-models/$path"
            echo "$sha  $HOME/.local/share/raea-models/$path" | sha256sum -c -
          done < <(tr -d '\r' < tools/release/models.tsv)
      # bin\ as release.yml's windows job fills it, with the ARM64 runtime, uv and DXC (RAEA_WIN_ARCH=arm64), then the
      # zip packed and checked by tools/release.sh as raea-VERSION-windows-arm64.zip. The skills gate is this commit's
      # (public raea has no feed app; cli.md is still checked against this build's help); nothing is drawn
      - name: Pack and check (tools/release.sh)
        env:
          RAEA_WIN_ARCH: arm64
          RAEA_CHECK_DIR: ${{ runner.temp }}/release-check
          RAEA_CHECK_NO_GPU: "1"
        run: |
          bash tools/release/onnxruntime.sh target/dist
          bash tools/release/win-bundle.sh target/dist
          v="${{ inputs.version }}"
          case $GITHUB_REF in
            refs/tags/v*)
              v=${v:-${GITHUB_REF_NAME#v}}
              # where the skills gate passed, as release.yml reads it (the tag's skills-passed line)
              eval "$(GITHUB_ENV= bash tools/release/skills-passed.sh "$GITHUB_REF_NAME" | grep '^RAEA_SKILLS_PASSED=')" ;;
            *) RAEA_SKILLS_PASSED=$(git rev-parse HEAD) ;;
          esac
          export RAEA_SKILLS_PASSED
          bash tools/release.sh "${v:-0.0.0-arm64}" target/dist HEAD
      # on a v* tag, beside release.yml's archives (the release made here if release.yml hasn't yet)
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; esac
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" $pre --title "raea ${GITHUB_REF_NAME#v}" --notes "Built by .github/workflows/release.yml; notes follow." ||
            gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/raea-*-windows-arm64.zip dist/raea-*-windows-arm64.zip.sha256 --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm64-zip
          path: dist/raea-*-windows-arm64.zip*
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm64-bins
          path: |
            target/dist/raea.exe
            target/dist/raea_bundle.dll
            target/dist/raea-rune-host.exe
            target/dist/raea-page-host.exe
            target/dist/raea-perceive.exe
          retention-days: 7
          if-no-files-found: ignore

  # vendor/metis-sys's header change reaches release.yml's x64 build too (windows-latest's Visual Studio): metis-sys
  # alone, in a scratch crate, compiled there
  metis-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: vendor/metis-sys
      - name: metis-sys on x64 MSVC
        run: |
          c="$RUNNER_TEMP/metis-x64"; mkdir -p "$c/src" && : > "$c/src/lib.rs"
          printf '[package]\nname = "metis-x64"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\nmetis-sys = { path = "%s" }\n[workspace]\n' "$(cygpath -m "$GITHUB_WORKSPACE/vendor/metis-sys")" > "$c/Cargo.toml"
          cl 2>&1 | head -1 || true
          cd "$c" && cargo build
