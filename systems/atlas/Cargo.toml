[package]
name = "raea-sys-atlas"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The second UV set raea's bakes share: planar charts packed into one atlas over a glTF, and each texel's point"

[dependencies]
# triangle BVH and ray casts (Apache-2.0); in the tree already through rapier3d
parry3d = "0.31"
rayon = "1"
serde_json = "1"
# a union-find's root (charts merged by shared edges)
raea-core-meshcheck = { path = "../../core/meshcheck" }
raea-sys-glb = { path = "../glb" }
