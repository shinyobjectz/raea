name: RaeaProbe
options:
  bundleIdPrefix: com.shinyobjectz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: BJJZ79J5NL
    CODE_SIGN_STYLE: Automatic
targets:
  RaeaProbe:
    type: application
    platform: iOS
    sources:
      - Probe
      - path: inputs
        type: folder
        buildPhase: resources
    info:
      path: Probe/Info.plist
      properties:
        CFBundleDisplayName: Raea Probe
        UILaunchScreen: {}
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinyobjectz.raeaprobe
        SWIFT_OBJC_BRIDGING_HEADER: Probe/probe.h
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -lraea_probe -lc++ -lz -liconv -framework Metal -framework QuartzCore -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox -framework CoreText -framework CoreGraphics -framework Security -framework IOSurface -framework AudioToolbox
        DEAD_CODE_STRIPPING: YES
