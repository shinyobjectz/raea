[package]
name = "raea-sys-fog"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Froxel fog (one medium in a grid along the view), glass seen through it, and flames drawn as volumes"

[dependencies]
raea-sys-frame = { path = "../frame" }
# whether the path tracer walks the fog volumes (<Pathtracer media>)
raea-sys-rt = { path = "../rt" }
raea-sys-volume = { path = "../volume" }
raea-core-program = { path = "../../core/program" }
raea-io-trace = { path = "../../io/trace" }
serde_json = "1"
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "bevy_solari"] }
bytemuck = "1"
