[package]
name = "raea-native"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
description = "raea's one native-call layer: the registry every host links (raea-motion, the sandbox, HostCore), the TypeScript types made from it, and the JavaScriptCore binding with the web shims bundles expect"

[lib]
name = "raea_native"

[features]
default = ["net"]
# the shell's network (net.rs: plain HTTP(S) under a policy, ureq + rustls); an exported game's player goes without
net = ["dep:ureq"]
# js-exec and the module seam: the agent's TS/TSX transpiled in process (raea-modules, deno_ast) and run as ES modules
modules = ["dep:raea-modules"]

[dependencies]
serde_json = "1"
# the flight recorder (trace.rs): stderr teed, fatal signals, resident memory; log records into events.jsonl
libc = "0.2"
log = "0.4"
sha2 = "0.10"
sha1 = "0.10"
getrandom = "0.3"
url = "2"
base64 = "0.22"
flate2 = "1"
# the shell's network (net.rs): plain HTTP(S) under a policy
ureq = { version = "2", optional = true }
# the shell's sqlite3, natively (SQLite is public domain; rusqlite MIT)
rusqlite = { version = "0.37", features = ["bundled"] }
# the shell's html-to-markdown (Apache-2.0) and tar (MIT/Apache)
htmd = "0.5"
tar = "0.4"
raea-modules = { path = "../modules", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# JavaScriptCore's Objective-C module loader (JSScript, JSModuleLoaderDelegate): ES modules on the system engine
objc2 = "0.6"
