# raea's agent (agent.feature): pi's agent loop (the vendored Rust port, crates/pi-ai and crates/pi-agent, MIT; see
# crates/NOTICE.md) and raea-spec (Gherkin for the harness). Moved from ~/host/agent on 2026-10-15 (agent.feature
# phase 2); the host app's ugc-agent, ugc-core and ugc-eval depend on them by path.
[workspace]
resolver = "2"
members = ["crates/pi-ai", "crates/pi-agent", "crates/raea-spec"]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/earendil-works/pi"
authors = ["Pi Rust Port Contributors"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
async-stream = "0.3"
bytes = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
ignore = "0.4"
shell-words = "1"
