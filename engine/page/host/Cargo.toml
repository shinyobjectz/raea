[package]
name = "raea-page-host"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A headless host for one raea page: a bundle mounted on a Blitz page at a window's size, driven and read over the Bevy Remote Protocol and MCP (page.input, page.ui, page.frame_png, page.state, page.a11y), for the benches"

[lib]
name = "raea_page_host"
path = "src/lib.rs"

[[bin]]
name = "raea-page-host"
path = "src/main.rs"

[features]
# the page on QuickJS (raea-runtime-js's portable engine) in place of JavaScriptCore
portable = ["raea-runtime-js/portable"]
# raea's window on screen (--window: the desktop app, docs/app.feature AP5/AP6); the benches and tests stay headless
window = ["bevy/bevy_winit", "dep:raea-runtime-plugins", "raea-page-window/window", "raea-page-ax/window"]

[dependencies]
raea-io-trace = { path = "../../../io/trace" }
# the window as an image the UI camera draws, picking's pointer input, the remote protocol, and every image format the
# page decodes (raea-page's IMAGE_DECODER decodes through bevy_image): the legacy app's list, which the benches ran on
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "default_font", "multi_threaded", "3d_bevy_render", "ui_bevy_render", "png", "tonemapping_luts", "ktx2", "zstd_rust", "bevy_picking", "ui_picking", "bevy_ui_widgets", "bevy_input_focus", "jpeg", "bevy_remote", "tga", "qoi", "tiff", "pnm", "ff", "dds", "exr", "hdr", "webp", "gif", "bmp", "ico"] }
raea-runtime-js = { path = "../../../runtime/js" }
# the page's accessibility: the `a11y` method's records, and the window's tree
raea-page-ax = { path = "../ax" }
raea-page = { path = ".." }
# the desktop window: --chrome and the native calls (clipboard, links, notifications, the dock badge, raea:// links)
raea-page-window = { path = "../window" }
raea-sys-page = { path = "../../../systems/page" }
# headless, the system calls are scripted (docs/targets.feature T2d)
raea-io-os = { path = "../../../io/os" }
# raea's settings file (~/.raea/env): the window's perf switches, set where the app's window has no shell (main.rs)
raea-io-home = { path = "../../../io/home" }
raea-sys-fonts = { path = "../../../systems/fonts" }
raea-runtime-dom = { path = "../../../runtime/dom" }
raea-runtime-input = { path = "../../../runtime/input" }
# the page's video and audio decoded by the platform (VideoToolbox, AudioToolbox through AVFoundation), as the legacy app
# had them: raea-page and raea-runtime-js take raea-io-media without a backend, and only this feature gives them one
raea-io-media = { path = "../../../io/media", default-features = false, features = ["apple"] }
blitz-traits = "=0.3.0-beta.4"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
# the live stage: <img data-raea-stage> (raea-page-stage)
raea-page-stage = { path = "../stage" }
# a page's interaction sounds: sound.fire (raea-page-sound, docs/hardware.feature HW0)
raea-page-sound = { path = "../sound" }
# Rune layers in the page: what's under a data-raea-renderer="rune" element drawn by Rune on this device (T6c)
raea-rune-slots = { path = "../../rune/slots" }
# the window build turns bevy_winit on for every Bevy app in the process; the stage's engine is told to leave it out (main.rs)
raea-runtime-plugins = { path = "../../../runtime/plugins", optional = true }
raea-runtime-view = { path = "../../../runtime/view" }
tiny_http = "0.12"
base64 = "0.22"

# raea-io-media is here for its feature (the platform decoders raea-page and raea-runtime-js use), not called directly
[package.metadata.cargo-shear]
ignored = ["raea-io-media"]

[dev-dependencies]
# T2b and T2d: the recorded net and system calls (tests/net_calls.rs)
raea-io-net-calls = { path = "../../../io/net/calls", features = ["serve"] }
raea-io-os = { path = "../../../io/os", features = ["recorded"] }
# a page's field pasted into (src/shell.rs's test)
blitz-html = "=0.3.0-beta.4"
keyboard-types = "0.8"
