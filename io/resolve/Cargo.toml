[package]
name = "raea-io-resolve"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A video page's URL to its videos and their streams (docs/videoform.feature VF1b): yt-dlp, fetched into ~/.raea/bin, checked against its release's SHA-256 sums, pinned, and moved forward when a site breaks"

[dependencies]
raea-io-home = { path = "../../io/home" }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
# Deno comes as a zip
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
