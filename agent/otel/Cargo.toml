[package]
name = "raea-otel"
version = "0.1.0"
edition = "2024"
publish = false
description = "raea's agent traces: OpenTelemetry spans as the host app's JSONL beside the run, and OTLP/HTTP (protobuf) to a collector (Arize Phoenix on :6006). One crate both hosts compose (agent/agent.feature)."

[workspace]

[dependencies]
serde_json = "1"
# the OTLP messages only, no SDK: spans are built here and encoded with prost
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
