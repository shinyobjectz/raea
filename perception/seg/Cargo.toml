[package]
name = "raea-overlay-seg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "J2b's overlay segmenter: a small convolutional network, trained in Rust (burn) on rdb's render pairs, that marks which pixels of a rendered frame are the edit's overlays"

[workspace]

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "train", "wgpu", "autodiff"] }
serde_json = "1"
# frames: Apple's decoder in-process (VideoToolbox)
raea-media = { path = "../../media", default-features = false, features = ["apple"] }

[profile.release]
debug = false

[patch.crates-io]
muxide = { path = "../../media/vendor/muxide" }
