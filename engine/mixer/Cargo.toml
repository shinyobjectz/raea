[package]
name = "raea-mixer"
version = "0.1.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"
description = "raea's one mixer core: the same Firewheel graph plays live in the device callback and renders offline as the bounce, so a render and a play sound the same, sample for sample (sdk/react/docs/audio-stack.md)"

[dependencies]
# the audio graph: sample-accurate scheduled events, custom nodes, a CPAL stream live and a processor pulled by hand
# offline. 0.12 because bevy_seedling 0.8 (the Bevy 0.19 release) pins it: one Firewheel for raea and Bevy.
firewheel = { version = "=0.12.0", default-features = false, features = ["std", "scheduled_events"] }
# the device: the cpal react and void use (0.15), driving Firewheel's processor from its callback (live.rs). Firewheel's
# own CPAL backend needs cpal 0.18, which can't link beside 0.15 (both link alsa-sys)
cpal = "0.15"
# the processor's buffers, pulled into a Vec for the bounce
audioadapter-buffers = { version = "4.0.0", default-features = false, features = ["std"] }
# sources decoded in 4 s windows (Symphonia)
raea-media = { path = "../media", default-features = false, features = ["soft-audio"] }
# the Tone graph and events (JSON from @raea/motion/tone)
serde_json = "1"
