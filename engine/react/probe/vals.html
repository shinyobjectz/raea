<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:900px;height:300px;background:#fff}#out{font:13px monospace;white-space:pre}</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="900" data-height="300"><svg width="200" height="40"><text id="t" x="0" y="20" font-size="16">hello world</text></svg><div id="out"></div></div>
<script>
var o=[];function v(k,f){try{o.push(k+" = "+JSON.stringify(f()))}catch(e){o.push(k+" ! "+e.message)}}
v("url.search",()=>new URL("https://a.b/c?d=1#h").search)
v("url keys",()=>Object.getOwnPropertyNames(Object.getPrototypeOf(new URL("https://a.b/"))).join(","))
v("url.href",()=>new URL("https://a.b/c?d=1#h").href)
v("toLocaleDateString",()=>new Date(2026,9,1).toLocaleDateString("en-US"))
v("dtf numeric",()=>new Intl.DateTimeFormat("en-US",{year:"numeric",month:"numeric",day:"numeric"}).format(new Date(2026,9,1)))
v("text bbox",()=>{var b=document.getElementById("t").getBBox();return [b.x,b.y,b.width,b.height]})
v("text rect",()=>{var b=document.getElementById("t").getBoundingClientRect();return [b.x,b.y,b.width,b.height]})
v("year only",()=>new Intl.DateTimeFormat("en-US",{year:"numeric"}).format(new Date(2026,0,1)))
v("getBBox own on proto",()=>!!Object.getOwnPropertyDescriptor(Object.getPrototypeOf(document.getElementById("t")),"getBBox"))
v("getBBox src",()=>String(document.getElementById("t").getBBox).slice(0,60))
v("span measure",()=>{var sp=document.createElement("span");sp.textContent="hello world";sp.style.cssText="position:absolute;left:-10000px;font-size:16px";document.body.appendChild(sp);var r=sp.getBoundingClientRect();sp.remove();return [r.width,r.height]})
v("span measure static",()=>{var sp=document.createElement("span");sp.textContent="hello world";sp.style.cssText="font-size:16px";document.body.appendChild(sp);var r=sp.getBoundingClientRect();var w=sp.offsetWidth;sp.remove();return [r.width,r.height,w]})
v("computed font",()=>getComputedStyle(document.getElementById("t")).fontFamily)
document.getElementById("out").textContent=o.join("\n")
</script></body></html>
