name: Feature request
description: Something you want to make that raea can't do yet, or makes hard.
body:
  - type: textarea
    id: making
    attributes:
      label: What you're trying to make
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The command, SDK part or app screen you use now, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: An example of how you'd use it helps most.
    validations:
      required: true
