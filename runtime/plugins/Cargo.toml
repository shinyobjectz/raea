[package]
name = "raea-runtime-plugins"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Bevy plugins inside raea's engine: compiled in by a crate that registers them, driven by generic rows through Bevy's TypeRegistry, stepped by the frame index"

[dependencies]
raea-sys-frame = { path = "../../systems/frame" }
raea-sys-material = { path = "../../systems/material" }
# three.js's shaders (docs/r3f.feature R3F11): a `three:uniforms` row patches a part's uniforms
raea-sys-three-shader = { path = "../../systems/three-shader" }
raea-sys-shader = { path = "../../systems/shader" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "bevy_state"] }
serde = "1"
raea-core-shape = { path = "../../core/shape" }
raea-bevy-world = { path = "../../engine/bevy-world" }
serde_json = "1"
# which plugins an Engine chose, into the run's trace (choose.rs)
raea-io-trace = { path = "../../io/trace" }

# Bevy's window plugin compiled in on the desktop, so `group` always has it to leave out (#182): raea's Engines are
# headless, and a build that brings bevy_winit any other way (raea-page-host's window, a plugin's x11, or cargo unifying
# features across `-p raea-cli -p raea-page-host`) made an event loop in each of a process's Apps; winit allows one, so
# the second panicked. Linux's winit needs a backend to compile: x11, loaded at run time and never opened here
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_winit"] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_winit", "x11"] }
