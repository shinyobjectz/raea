[package]
name = "raea-app-videoform-checks"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A videoform's rules checked on a composition before any render (docs/videoform.feature VF10, VF11): the composition read from its worlds as a reference is, each cut's picture pooled from its footage's kept columns (a shot embedded once, when its footage is first read), and each rule of NAME.taste.ts tested on it with the test that mined it; run by raea check PROJECT with the project's taste"

[dependencies]
raea-core-facts = { path = "../../core/facts" }
# the videoform as checking reads it, the footage's reading, and a render's layers
raea-app-videoform = { path = "../videoform" }
raea-sys-videoform = { path = "../../systems/videoform" }
raea-sys-videoform-rules = { path = "../../systems/videoform-rules" }
# each cut's kind: the footage's nearest, as following holds it
raea-sys-videoform-follow = { path = "../../systems/videoform-follow" }
raea-sys-columns = { path = "../../systems/columns" }
raea-sys-fingerprint = { path = "../../systems/fingerprint" }
raea-sys-fingerprint-use = { path = "../../systems/fingerprint-use" }
raea-io-home = { path = "../../io/home" }
serde_json = "1"
