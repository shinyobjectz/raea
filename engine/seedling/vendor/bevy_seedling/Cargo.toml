[package]
edition = "2024"
rust-version = "1.95.0"
name = "bevy_seedling"
version = "0.8.0"
authors = ["Corvus Prudens <corvusprudens@gmail.com>"]
build = false
exclude = ["/assets"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A sprouting integration of the Firewheel audio engine"
documentation = "https://docs.rs/bevy_seedling"
readme = "README.md"
keywords = [
    "gamedev",
    "audio",
    "bevy",
    "firewheel",
]
categories = [
    "game-development",
    "multimedia::audio",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/corvusprudens/bevy_seedling"

[package.metadata.docs.rs]
all-features = true

[features]
# raea: the backends (cpal, rtaudio, web_audio) and hrtf removed with their dependencies: raea runs seedling's processor
# on its own core, and cpal 0.18 (which links alsa-sys, as the cpal 0.15 react and void use does) must stay out of the
# lockfile
adpcm = [
    "symphonia",
    "symphonium/adpcm",
]
default = [
    "wav",
    "ogg",
    "rand",
    "reflect",
    "diagnostics",
]
dev = [
    "entity_names",
    "track_location",
]
diagnostics = [
    "dep:bevy_diagnostic",
    "firewheel/node_profiling",
]
effects = ["firewheel/all_nodes"]
entity_names = []
flac = [
    "symphonia",
    "symphonium/flac",
]
loudness = [
    "dep:ebur128",
    "dep:portable-atomic",
]
mkv = [
    "symphonia",
    "symphonium/mkv",
]
mp3 = [
    "symphonia",
    "symphonium/mp3",
]
ogg = [
    "symphonia",
    "symphonium/ogg",
    "symphonium/vorbis",
]
profiling = ["dep:audioadapter-buffers"]
rand = ["dep:rand"]
reflect = [
    "firewheel/bevy_reflect",
]
symphonia = [
    "dep:symphonia",
    "dep:symphonium",
    "firewheel/symphonium",
]
track_location = []
wav = [
    "symphonia",
    "symphonium/wav",
    "symphonium/pcm",
]

