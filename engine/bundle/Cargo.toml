[package]
name = "raea-bundle"
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-ALv2"
publish = false
description = "A work folder's TypeScript, TSX and their imports bundled in process by Rolldown (Vite's bundler, MIT): no bun process (docs/vite-in-raea.md, A1)"

# raea links none of this: raea-motion loads the cdylib at run time (sdk/react/src/motion.rs, ffi below), so Rolldown's
# dependencies never share a feature graph with raea's (their serde_json preserve_order and arbitrary_precision once
# reached every JSON map and number in raea-motion: f60e0b7). The rlib is for the tests and the raea-bundle binary.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "1"
rolldown = "=1.2.12"
# CSS imports and CSS modules (A2): @imports inlined, nesting and newer syntax lowered for Stylo
lightningcss = { version = "=1.0.0-alpha.72", features = ["bundler"] }
anyhow = "1"
# the Z3 compile (z3.rs, a live bundle's TSX): oxc as Rolldown 1.2.12 uses it
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic", "ast_visit"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Rolldown 1.2.12 is the newest whose oxc (0.152) builds on raea's rustc 1.96 (oxc 0.153 needs 1.97). Rolldown's own
# crates ask each other for ^1.2.12, which resolves to the newest, so each is held at 1.2.12 here (unused in the code).
# Moving Rolldown up means moving all of these together.
rolldown_common = "=1.2.12"
rolldown_dev_common = "=1.2.12"
rolldown_devtools = "=1.2.12"
rolldown_devtools_action = "=1.2.12"
rolldown_ecmascript = "=1.2.12"
rolldown_ecmascript_utils = "=1.2.12"
rolldown_error = "=1.2.12"
rolldown_fs = "=1.2.12"
rolldown_plugin = "=1.2.12"
rolldown_plugin_asset_module = "=1.2.12"
rolldown_plugin_chunk_import_map = "=1.2.12"
rolldown_plugin_copy_module = "=1.2.12"
rolldown_plugin_data_url = "=1.2.12"
rolldown_plugin_hmr = "=1.2.12"
rolldown_plugin_lazy_compilation = "=1.2.12"
rolldown_plugin_oxc_runtime = "=1.2.12"
rolldown_plugin_utils = "=1.2.12"
rolldown_resolver = "=1.2.12"
rolldown_sourcemap = "=1.2.12"
rolldown_std_utils = "=1.2.12"
rolldown_tracing = "=1.2.12"
rolldown_utils = "=1.2.12"
