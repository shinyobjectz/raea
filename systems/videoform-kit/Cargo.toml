[package]
name = "raea-sys-videoform-kit"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A brand's kit (docs/videoform.feature VF9b): its stills and graphic clips, kept in its fingerprint by content hash, each read once for what it is (a logo, a product, a person, a testimonial, a screenshot, a graphic, a clip), its words and colours, and the one a card in a cut shows chosen by what's said over it"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
