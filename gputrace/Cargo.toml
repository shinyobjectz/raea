[package]
name = "raea-gputrace"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GPU telemetry for raea's flight recorder: every wgpu error and lost device classified by the subsystem behind it (quads, kgpu, rdb, video, Bevy, the driver), and each submission's latency, slow ones and stalls, in the run's trace"

[dependencies]
wgpu = "=29.0.4"
serde_json = "1"
raea-native = { path = "../native" }
