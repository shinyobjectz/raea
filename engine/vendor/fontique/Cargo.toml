# Vendored from https://github.com/linebender/parley (rev 62790943, fontique), Apache-2.0 OR MIT.
# Local changes: macOS system families take CoreText weights and member order (src/backend/coretext.rs),
# which is how Chrome 152 matches installed Mac fonts; Blink's synthetic-bold threshold (src/font.rs). Scripts
# without a CoreText sample fall back through the system font's cascade list (backend/coretext.rs fallback_cascade).
# Generic families default to Chrome 152's macOS choices (backend/coretext.rs).
[package]
name = "fontique"
version = "0.11.0"
description = "Font enumeration and fallback."
keywords = ["font", "text"]
categories = ["gui", "os"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/parley"

[package.metadata.docs.rs]
all-features = true


[features]
default = ["system"]
std = ["read-fonts/std", "dep:memmap2", "parlance/std"]
libm = ["read-fonts/libm"]
bytemuck = ["parlance/bytemuck"]
# Enables support for system font backends
system = [
    "std",
    "dep:windows",
    "dep:windows-core",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-core-text",
    "dep:objc2-foundation",
    "dep:yeslogic-fontconfig-sys",
    "dep:roxmltree",
]

# Use dlopen to load the fontconfig library. This allows Fontique to compile even if the
# system does not have fontconfig installed, although the font fallback to system fonts
# will not work properly in this case (no such fallback will occur)
fontconfig-dlopen = ["yeslogic-fontconfig-sys?/dlopen"]

[dependencies]
read-fonts = { version = "0.41.0", default-features = false }
linebender_resource_handle = { version = "0.1.1", default-features = false }
smallvec = "1.15.1"
memmap2 = { version = "0.9.10", optional = true }
hashbrown = { version = "0.17.0", default-features = false, features = ["default-hasher", "raw-entry"] }
parlance = { git = "https://github.com/linebender/parley", rev = "62790943af982ad3388a3ff96cef6f90ac80a8bb", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"], optional = true }
windows-core = { version = "0.62.2", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# FIX: Enable relax-sign-encoding to prevent the bug described in this issue: https://github.com/madsmtm/objc2/issues/566
objc2 = { version = "0.6.4", optional = true, features = ["std", "relax-sign-encoding"] }
# NOTE: When updating objc2-foundation, objc2-core-foundation, or objc2-core-text make sure to use the version of objc2
# that they reference to prevent crate duplication.
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "alloc",
    "NSArray",
    "NSEnumerator",
    "NSPathUtilities",
    "NSString",
] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "CFBase",
    "CFURL",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-text = { version = "0.3.2", optional = true, default-features = false, features = [
    "CTFont",
    "CTFontDescriptor",
    "CTFontCollection",
    "CTFontTraits",
] }

[target.'cfg(any(target_os = "linux", target_os="freebsd"))'.dependencies]
yeslogic-fontconfig-sys = { version = "6.0.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
roxmltree = { version = "0.21.1", optional = true }
