# Vendored from https://github.com/DioxusLabs/blitz (rev a53fbab, packages/blitz-dom; rebased onto the 0.3.0-beta.3 release,
# the one dioxus-native 0.8 pins, by a 3-way merge from a53fbab),
# MIT OR Apache-2.0. Local change: the composition format's clip-local clock for CSS animations
# (BaseDocument::set_animation_origin, src/stylo.rs "animation origin"). text-wrap: balance
# (src/layout/inline.rs). Container query units:
# query_container_size answers from layout, resolve() relayouts moved containers (src/resolve.rs).
# Form controls get Chrome's UA font (assets/default.css).
[package]
name = "blitz-dom"
description = "Blitz DOM implementation"
version = "0.3.0-beta.3"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.91.0"
[features]
default = [
    "svg",
    "woff",
    "accessibility",
    "system-fonts",
    "file-input",
    "custom-widget",
    "text-transform-icu"
]
custom-widget = ["dep:anyrender", "accessibility"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "dep:svgtypes"]
# WOFF decoding (using the "wuff" crate which is pure Rust)
woff = ["dep:wuff"]
accessibility = ["accesskit"]
system-fonts = ["parley/system"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["parley/complex-scripts"]
# text-transform-icu: language-aware, Unicode-complete case mapping for `text-transform`
# (otherwise falls back to the standard library's case mapping)
text-transform-icu = ["dep:icu_casemap", "dep:writeable"]
autofocus = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
# CSS vertical `writing-mode` support (layout runs in each box's writing-mode frame; see layout/writing_mode.rs)
writing-mode = ["stylo_taffy/writing-mode"]
file-input = []
# Overlay-scrollbar thumb interaction (drag + hover tracking). Normally
# enabled through `blitz-paint/scrollbars`, which paints the thumbs.
scrollbars = []
parallel-construct = []
log-phase-times = ["debug_timer/enable"]

[dependencies]
blitz-traits = { version = "=0.3.0-beta.3", default-features = false }
stylo_taffy = { version = "=0.3.0-beta.3", default-features = false, features = ["default"] }
debug_timer = { version = "0.1.2" }
style = { version = "0.22.0", package = "stylo" }
selectors = { version = "0.41.0" }
cssparser = { version = "0.38.0" }
style_config = { version = "0.22.0", package = "stylo_static_prefs" }
style_traits = { version = "0.22.0", package = "stylo_traits" }
style_dom = { version = "0.22.0", package = "stylo_dom" }
app_units = "0.7.5"
euclid = "0.22"
atomic_refcell = "0.1.13"
markup5ever = "0.40.0"
smallvec = "1"
thin-vec = "0.2"
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "bc525c030e67d2fd58ecb7b96742f4fb34866c44", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
anyrender = { version = "0.14.0", optional = true }
accesskit = { version = "0.25", optional = true }
parley = { git = "https://github.com/linebender/parley", rev = "62790943af982ad3388a3ff96cef6f90ac80a8bb", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
linebender_resource_handle = "0.1"
color = "0.3"
kurbo = "0.13.1"
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_core = { version = "2.3", default-features = false }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false, optional = true }
slotmap = "1.0.7"
bitflags = "2.8.0"
tracing = { version = "0.1.40", optional = true }
rayon = "1"
image = { version = "0.25.6", default-features = false }
usvg = { version = "0.48.1", optional = true }
svgtypes = { version = "0.16.1", optional = true }
wuff = { version = "0.2", optional = true }
html-escape = "0.2.13"
percent-encoding = "2.3.1"
url = "2.5.0"
keyboard-types = "0.7"
cursor-icon = "1"
thread_local = "1"
web-time = "1"

[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
