# systems that hold only a facility another system may build on (docs/overhaul.md: the mixer graph, ONNX sessions,
# Vision requests, K kernels on the GPU)
[facility]
# a videoform's kept rows, its vocabulary's report, shot kinds and structure (its rules build on them: VF8)
raea-sys-videoform = true
# a brand's kit and how an asset is known (following a videoform shows its assets: VF9b)
raea-sys-videoform-kit = true
# the frame's rows every pass reads (FrameRows, the edit, the clock, row helpers)
raea-sys-frame = true
# cuts between cameras: the frames that start a shot and the last cut drawn (raea-sys-frame re-exports it)
raea-sys-shots = true
# the layer pass's keys, table, raster and NAME.layers (raea-sys-frame records the 3D through it)
raea-sys-layers = true
# a row's standard material and its maps (meshseq builds its mesh's on it)
raea-sys-material = true
# a row's mesh from JSON, Bevy's primitives by name (materials and reflected Mesh handles build on it)
raea-sys-mesh = true
# the character's rig, poses, forward kinematics, IK and joint limits (what the hands do with things builds on it)
raea-sys-body = true
# how a texture is read (materials, shaders and models set it the same way)
raea-sys-sampler = true
# a shader's inputs, accessors and registration (surface shaders and frame passes share them)
raea-sys-shader = true
# a WGSL source read as text: uniform and storage layouts, bindings renumbered (raea-sys-shader builds on it)
raea-sys-shader-wgsl = true
# the pass mask (looks and the paint look read which pass drew each pixel)
raea-sys-compose = true
# ink outlines (the frame's look sets its camera's)
raea-sys-post = true
# the froxel grid and glass fogged through it (looks and greybox surfaces keep a mesh's fog copy)
raea-sys-fog = true
# simulated volumes (a fire row with a sim is one)
raea-sys-volume = true
# the scene's ray tracing (the traced-light pass reads its scene)
raea-sys-rt = true
raea-sys-mix = true
# the mix before the master: dialogue at one level, room tone at the joins (the mix masters what it gives)
raea-sys-mix-level = true
raea-sys-tone = true
raea-sys-ml = true
raea-sys-mlx = true
raea-sys-layout = true
raea-sys-vision = true
# a file's encoder columns (Fingerprint's heads read them)
raea-sys-columns = true
# a fingerprint's taxonomy, evidence and heads (raea-sys-fingerprint-use scores, compares and picks with them)
raea-sys-fingerprint = true
# grow, profile and the heads' readings over a file (raea-sys-fingerprint-things reads things on them)
raea-sys-fingerprint-use = true
raea-sys-song = true
raea-sys-k = true
raea-sys-procmat = true
# trees grown by species as meshes: crowns, leaves, bark and roots (the city's tree LODs build on them)
raea-sys-foliage = true
raea-sys-canvas = true
raea-sys-filters = true
raea-sys-page = true
# a page's loads (raea-sys-page's net)
raea-sys-page-net = true
# the op wire applied to a page (raea-sys-page's ops)
raea-sys-page-ops = true
raea-sys-fonts = true
raea-sys-image = true
# rain's run-off over a model's surfaces (the weathering bake builds its flow and stains on it)
raea-sys-runoff = true
# where hands, feet and wheels wear a model, and where things belong (the weathering bake's touch and spots)
raea-sys-touch = true
# what a model is exposed to through the year: the sun by date, driven snow, where blown things settle (the weathering bake's causes3)
raea-sys-exposure = true
# where a building breaks: cracks from its openings' corners, how readily a coat comes off, debris under the losses (the weathering bake's causes3 a and debris)
raea-sys-damage = true
# a .glb read as JSON and bytes and written back (the weathering bake reads and rewrites models through it)
raea-sys-glb = true
# the atlas raea's bakes share: charts, packing, each texel's point (the cause maps and the light bake lie over it)
raea-sys-atlas = true
