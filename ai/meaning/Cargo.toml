[package]
name = "raea-meaning"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea's meaning plane: frame-embedding columns and K kernels over them (docs/relational-plan.feature, Phase 3)"

[dependencies]
# Core ML for `ingest --coreml` (the phone's SigLIP package on the Neural Engine), through perception's wrapper; Apple only
raea-perception = { path = "../perception" }
# the host app's embedder: SigLIP 2 base p16-256 (Apache-2.0) on ONNX Runtime, the same vectors as the phone's Core ML build
raea-embed = { path = "embed" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
