[package]
name = "raea-bevy-plugins"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Bevy plugins compiled into raea's engine, each behind a feature (sdk/motion/docs/bevy-plugins.md): registered with rdb's plugin hooks, driven from TSX by generic reflect rows, stepped by the frame index"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "default_app", "default_font", "multi_threaded", "3d_bevy_render", "ui_bevy_render", "png", "tonemapping_luts", "ktx2", "zstd_rust"] }
rdb = { path = "../rdb", default-features = false }
# physics: deterministic, stepped in FixedPostUpdate (MIT OR Apache-2.0); no debug gizmos, scenes or picking
avian3d = { version = "=0.7.0", optional = true, default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints", "collider-from-mesh"] }
# GPU particles (MIT OR Apache-2.0); asks bevy for `x11`, which brings bevy_winit (WinitPlugin is turned off here)
bevy_hanabi = { version = "=0.19.0", optional = true, default-features = false, features = ["3d"] }
rand_pcg = { version = "0.10", optional = true }
# tweens (MIT OR Apache-2.0); no sprite, UI or text lenses
bevy_tweening = { version = "=0.16.0", optional = true, default-features = false }

[features]
avian = ["dep:avian3d"]
hanabi = ["dep:bevy_hanabi", "dep:rand_pcg"]
tweening = ["dep:bevy_tweening"]
