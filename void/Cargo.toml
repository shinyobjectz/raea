[package]
name = "raea-void"
version = "0.1.0"
edition = "2024"
publish = false
description = "raea void: a black canvas and one composer. Say or type anything; it becomes a React + TypeScript project rendered by rdb (void.feature)"

[workspace]

[[bin]]
name = "void"
path = "src/main.rs"

[dependencies]
# the shell: one chromeless window drawn by Dioxus native on the RAEA engine (no WebKit: the webview chrome was deleted
# 2026-10-17, the user: "running and delivered in raea engine so its dogfooding its own system")
dioxus = { version = "=0.8.0-alpha.2", features = ["native"] }
# the native chrome's launch, vendored so its renderer is the engine's quads (vendor/dioxus-native)
dioxus-native = { version = "=0.8.0-alpha.2", default-features = false, features = ["quads", "net", "html", "svg", "system-fonts", "clipboard", "woff", "autofocus"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# the custom protocol's responses, as wry re-exports them
http = "1"
base64 = "0.22"
# check packs (checks.rs): the answer cache is keyed by a hash of the media, context and questions
sha2 = "0.10"
# the brain: an OpenAI-compatible or Anthropic endpoint (becomes raea/agent's pi-ai when agent.feature phase 2 lands)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
futures-util = "0.3"
# traces (agent/otel): spans to Phoenix over OTLP and as the host app's JSONL beside each run
raea-otel = { path = "../agent/otel" }
# void's own MCP server (mcp.rs): an agent drives, tests and screenshots the running app
tiny_http = "0.12"
objc2 = "0.6"
# the magic terminal's emulator: Alacritty's grid, cursor, colours and escape codes (Apache-2.0); void writes ANSI into it
alacritty_terminal = "=0.26.0"
# the footprint memguard measures (mem.rs: proc_pid_rusage)
libc = "0.2"

# the voice (voice.rs): mic and speaker, and four models on ONNX Runtime, the same ort pin and prebuilt runtime as
# raea/meaning/embed and raea/perception
cpal = "0.15"
ort = "=2.0.0-rc.13"
rustfft = "6"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# the native stage (src/stage_native.rs): the RAEA engine's live play in void's window, on the GPU
raea-react = { path = "../react", default-features = false }
# the flight recorder (raea_native::trace): panics and crashes with their backtraces, per session
raea-native = { path = "../native" }
raea = { path = "../engine", default-features = false, features = ["network"] }
wgpu = "=29.0.4"

[profile.release]
debug = "line-tables-only"

# the engine's vendored Blitz, Stylo, Vello and Parley, as raea-react builds them (react/Cargo.toml)
[patch.crates-io]
dioxus-native = { path = "vendor/dioxus-native" }
blitz-paint = { path = "../engine/vendor/blitz-paint" }
blitz-dom = { path = "../engine/vendor/blitz-dom" }
stylo_taffy = { path = "../engine/vendor/stylo_taffy" }
muxide = { path = "../media/vendor/muxide" }
stylo = { path = "../engine/vendor/stylo" }
vello_common = { path = "../engine/vendor/vello_common" }
vello_cpu = { path = "../engine/vendor/vello_cpu" }
anyrender_vello_cpu = { path = "../engine/vendor/anyrender_vello_cpu" }
num_threads = { path = "../engine/vendor/num_threads" }
anyrender = { path = "../engine/vendor/anyrender" }
anyrender_svg = { path = "../engine/vendor/anyrender_svg" }

[patch."https://github.com/linebender/parley"]
parley_engine = { path = "../engine/vendor/parley_engine" }
fontique = { path = "../engine/vendor/fontique" }
parley = { path = "../engine/vendor/parley" }
