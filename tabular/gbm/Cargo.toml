[package]
name = "raea-gbm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tabular dreaming's base, all Rust: gradient-boosted trees (Perpetual, pure Rust), grouped cross-validation and AUC over raea's tables"

[dependencies]
perpetual = "=3.0.0-rc.2"  # the only release that builds on stable Rust (2.x use #![feature])
serde_json = "1"
# frames for J2b's layer patches: Apple's decoder in-process (VideoToolbox), no ffmpeg or software codecs
raea-media = { path = "../../media", default-features = false, features = ["apple"] }

[profile.release]
debug = false

# raea-media's vendored muxide: patches only apply at a workspace root, so repeated here
[patch.crates-io]
muxide = { path = "../../media/vendor/muxide" }
