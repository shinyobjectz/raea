name: WsxProbe
options:
  bundleIdPrefix: com.shinyobjectz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: BJJZ79J5NL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  WsxProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Tools
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinyobjectz.wsxprobe
        SWIFT_OBJC_BRIDGING_HEADER: Sources/wsx.h
        LIBRARY_SEARCH_PATHS: ../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lwsx
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WSX
        INFOPLIST_KEY_CFBundleDisplayName: WSX Probe
  WsxControl:
    type: application
    platform: iOS
    sources:
      - path: Sources/App.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinyobjectz.wsxcontrol
        INFOPLIST_KEY_CFBundleDisplayName: WSX Control
