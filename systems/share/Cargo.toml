[package]
name = "raea-sys-share"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Equal parts share their assets (runtime/scene3d re-exports it): one Mesh per shape and one StandardMaterial per value, let go once no part holds them"

[dependencies]
