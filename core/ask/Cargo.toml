[package]
name = "raea-core-ask"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Questions for the decision model (clef-omni): their types, how answers read, the standard sets and the model's limits"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# a file's ident (ident.rs), the one the ledger keeps
sha2 = "0.10"
# the TypeScript declarations are generated from these types, so the two can't drift
ts-rs = "12"
